name: L1B B-2 PR97 exact commit builder

on:
  push:
    branches: [ops/l1b-b2-pr97-commit-builder]
    paths:
      - .github/workflows/l1b-b2-pr97-commit-builder.yml
      - ops/l1b-b2-pr97-commit-builder.py

permissions:
  contents: write

concurrency:
  group: l1b-b2-pr97-commit-builder
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY_ID: '1297538303'
  EXPECTED_REF: refs/heads/ops/l1b-b2-pr97-commit-builder
  EXPECTED_BASE_SHA: 297854c09205097a6a58cbce4c64961c802cd7a3
  EXPECTED_TARGET_HEAD: fe1e175ac1b95b1dbf2f2813171d65376cd4c402
  EXPECTED_FIX_HEAD: 1fbaf773c1125bd54e5cd93b2a21afd761d36bf7
  EXPECTED_FIX_BLOB: 55fc12f22741d8e8bac1cb011b6994cacc9f5681
  EXPECTED_BUILDER_BLOB: 28af2ce2c448322a1045eb986c3ddec215d9d35b

jobs:
  build-exact-commit:
    name: Build exact one-commit PR97 source
    if: github.repository == 'champban/dashboard' && github.ref == 'refs/heads/ops/l1b-b2-pr97-commit-builder' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact builder source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: builder

      - name: Checkout exact recovery fix source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1fbaf773c1125bd54e5cd93b2a21afd761d36bf7
          fetch-depth: 0
          persist-credentials: false
          path: fix

      - name: Checkout exact reviewed PR97 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fe1e175ac1b95b1dbf2f2813171d65376cd4c402
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Validate exact builder boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.repository_id }}" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "${{ github.ref }}" == "$EXPECTED_REF" ]]
          [[ "${{ github.run_attempt }}" == '1' ]]
          [[ "$(git -C builder merge-base "$EXPECTED_BASE_SHA" HEAD)" == "$EXPECTED_BASE_SHA" ]]
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .github/workflows/l1b-b2-pr97-commit-builder.yml
          ops/l1b-b2-pr97-commit-builder.py
          EOF
          git -C builder diff --name-only "$EXPECTED_BASE_SHA"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          [[ "$(git -C builder hash-object ops/l1b-b2-pr97-commit-builder.py)" == "$EXPECTED_BUILDER_BLOB" ]]
          [[ "$(git -C fix rev-parse HEAD)" == "$EXPECTED_FIX_HEAD" ]]
          [[ "$(git -C fix hash-object ops/l1b-b2-aicc-acl-recovery-fix.sh)" == "$EXPECTED_FIX_BLOB" ]]
          [[ "$(git -C target rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          python3 -m py_compile builder/ops/l1b-b2-pr97-commit-builder.py

      - name: Build immutable one-commit PR97 object
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 builder/ops/l1b-b2-pr97-commit-builder.py target fix | tee "$RUNNER_TEMP/builder-result.txt"
          grep -Eq '^L1B_B2_PR97_REMEDIATED_COMMIT=[0-9a-f]{40}$' "$RUNNER_TEMP/builder-result.txt"
          grep -Eq '^L1B_B2_PR97_REMEDIATED_TREE=[0-9a-f]{40}$' "$RUNNER_TEMP/builder-result.txt"

      - name: Verify safe immutable outputs
        shell: bash
        run: |
          set -euo pipefail
          commit='${{ steps.build.outputs.commit_sha }}'
          tree='${{ steps.build.outputs.tree_sha }}'
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          rm -f -- "$RUNNER_TEMP/builder-result.txt" "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          echo "PR97_REMEDIATED_COMMIT=$commit"
          echo "PR97_REMEDIATED_TREE=$tree"
