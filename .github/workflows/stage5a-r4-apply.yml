name: Stage 5A round 4 apply

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-r4-apply.yml

permissions:
  contents: write

concurrency:
  group: stage5a-r4-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate approved source and trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/feature/stage5a-line-import-conflict" ]]
          [[ "$(git log -1 --format=%s)" == "ops(stage5a): run exact staged payload" ]]
          git merge-base --is-ancestor 921a7d780713dead2ab1c8b554dddaad0c59b4d2 HEAD
          git diff --quiet 921a7d780713dead2ab1c8b554dddaad0c59b4d2 -- \
            BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx \
            package.json package-lock.json .github/workflows/verify.yml

      - name: Decode and validate deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' < .stage5a-r4/patch.py.gz.b64.exact > "$RUNNER_TEMP/patch.b64"
          payload_sha="$(sha256sum "$RUNNER_TEMP/patch.b64" | cut -d' ' -f1)"
          echo "payload_sha=$payload_sha"
          [[ "$payload_sha" == "4aa90f9ae9758b0959aab589922bcd11c72454faf52660bb181e66f0affe55fb" ]] || { echo "payload checksum mismatch"; exit 21; }
          base64 -d "$RUNNER_TEMP/patch.b64" > "$RUNNER_TEMP/stage5a-r4.py.gz"
          gzip_sha="$(sha256sum "$RUNNER_TEMP/stage5a-r4.py.gz" | cut -d' ' -f1)"
          echo "gzip_sha=$gzip_sha"
          [[ "$gzip_sha" == "999f926a00dc11d23bd8147f89f18d5b8c24750abd6d47c147c897f1d80a567e" ]] || { echo "gzip checksum mismatch"; exit 22; }
          gzip -d -c "$RUNNER_TEMP/stage5a-r4.py.gz" > "$RUNNER_TEMP/stage5a-r4.py"
          script_sha="$(sha256sum "$RUNNER_TEMP/stage5a-r4.py" | cut -d' ' -f1)"
          echo "script_sha=$script_sha"
          [[ "$script_sha" == "fac74c75081bd1155f60f720e6ff7d98ada9208e1c2a1f82f99ee163812860a5" ]] || { echo "script checksum mismatch"; exit 23; }
          python3 -m py_compile "$RUNNER_TEMP/stage5a-r4.py"
          PYTHONUNBUFFERED=1 python3 "$RUNNER_TEMP/stage5a-r4.py"

      - name: Validate source-only boundary before build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/actual.txt"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify generated package
        run: npm run verify

      - name: Scan secrets
        run: npm run scan-secrets

      - name: Validate final boundary and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final.txt"
          cat > "$RUNNER_TEMP/allowed-final.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed-final.txt" "$RUNNER_TEMP/final.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/final.txt"

      - name: Commit and push verified source-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P Boy Stage5A Automation"
          git config user.email "champbanyat@gmail.com"
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && { echo "No remediation changes staged"; exit 1; }
          git commit -m "fix(stage5a): preserve concurrent local edits during recovery"
          git push origin HEAD:feature/stage5a-line-import-conflict

# Owner-triggered reuse of the already staged, checksum-pinned patch. No backup or Production operation.
