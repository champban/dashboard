name: Stage 5A final source remediation

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-r4-apply.yml
      - .stage5a-r4/finalize.py
      - .stage5a-r4/run.py

permissions:
  contents: write

concurrency:
  group: stage5a-final-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate unchanged product source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 921a7d780713dead2ab1c8b554dddaad0c59b4d2 HEAD
          git diff --quiet 921a7d780713dead2ab1c8b554dddaad0c59b4d2 -- BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md build/line-contract.test.mjs build/sync-content-check.test.mjs docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx package.json package-lock.json .github/workflows/verify.yml

      - name: Apply checksum-pinned final source remediation
        run: python3 .stage5a-r4/run.py

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run verify
          npm run scan-secrets
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md build/line-contract.test.mjs build/sync-content-check.test.mjs docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P Boy Stage5A Automation'
          git config user.email 'champbanyat@gmail.com'
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md build/line-contract.test.mjs build/sync-content-check.test.mjs docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && exit 1
          git commit -m 'fix(stage5a): close final recovery concurrency gaps'
          git push origin HEAD:feature/stage5a-line-import-conflict

      - name: Remove temporary tooling and assert final boundary
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .stage5a-r4
          git rm -f --ignore-unmatch .github/workflows/stage5a-r4-apply.yml .github/workflows/stage5a-r4-diagnose.yml .github/workflows/stage5a-r4-transfer-apply.yml .github/workflows/stage5a-r4-remediate.yml
          git diff --cached --quiet || git commit -m 'chore(stage5a): remove temporary remediation tooling'
          git push origin HEAD:feature/stage5a-line-import-conflict
          git diff --name-only 297854c09205097a6a58cbce4c64961c802cd7a3..HEAD | LC_ALL=C sort > "$RUNNER_TEMP/release.txt"
          printf '%s\n' BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md build/line-contract.test.mjs build/sync-content-check.test.mjs docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx | LC_ALL=C sort > "$RUNNER_TEMP/release-expected.txt"
          diff -u "$RUNNER_TEMP/release-expected.txt" "$RUNNER_TEMP/release.txt"

# rerun after focused-test scope variable normalization
