name: Stage 5A final review guards

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-final-review-guards.yml

permissions:
  contents: write

concurrency:
  group: stage5a-final-review-guards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate exact approved source state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/stage5a-line-import-conflict"
          test "$(git rev-parse HEAD^)" = "ca66327149f543f18ca0afb637dcb9e817fe7e5e"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "297854c09205097a6a58cbce4c64961c802cd7a3"
          git merge-base --is-ancestor "0bad8090e97577deb247947dcffe46aef41f44a9" HEAD
          test "$(git diff --name-only "0bad8090e97577deb247947dcffe46aef41f44a9"..HEAD | LC_ALL=C sort)" = ".github/workflows/stage5a-final-review-guards.yml"
          git diff --quiet "0bad8090e97577deb247947dcffe46aef41f44a9"..HEAD -- \
            BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx \
            package.json package-lock.json .github/workflows/verify.yml

      - name: Apply four reviewed source guards
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > "$RUNNER_TEMP/stage5a.patch" <<'STAGE5A_PATCH'
          
          STAGE5A_PATCH
          git apply --check "$RUNNER_TEMP/stage5a.patch"
          git apply "$RUNNER_TEMP/stage5a.patch"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md mobile/index.html src/App.jsx | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run verify
          npm run scan-secrets
          git diff --check
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('BUILD-MANIFEST.json','utf8'));
          const hash=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          if(manifest.full.sha256!==hash('index.html'))throw Error('Full manifest hash mismatch');
          if(manifest.mobile.sha256!==hash('mobile/index.html'))throw Error('Mobile manifest hash mismatch');
          console.log('Generated package/manifest parity: PASS');
          NODE

      - name: Commit clean exact nine-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage5a-final-review-guards.yml
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          actual="$(git diff --cached --name-only "297854c09205097a6a58cbce4c64961c802cd7a3" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx | LC_ALL=C sort)"
          test "$actual" = "$expected"
          ! printf '%s\n' "$actual" | grep -E '^(supabase/|auth\.js$|line-sync\.js$|package(-lock)?\.json$|\.github/)'
          git diff --cached --check
          git config user.name "P Boy Stage5A Automation"
          git config user.email "champbanyat@gmail.com"
          git commit -m "fix(stage5a): close final recovery races"
          test "$(git diff --name-only "297854c09205097a6a58cbce4c64961c802cd7a3"..HEAD | LC_ALL=C sort)" = "$expected"
          git push origin HEAD:feature/stage5a-line-import-conflict
