name: Stage 5A source export

on:
  push:
    branches:
      - work/stage5a-pr105-export
    paths:
      - .github/workflows/stage5a-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 11e23332038b0271c211edca55cfbe73e0e5497b
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Archive exact local workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 11e23332038b0271c211edca55cfbe73e0e5497b
          tar --exclude=.git -czf "$RUNNER_TEMP/stage5a-workspace.tar.gz" .
          sha256sum "$RUNNER_TEMP/stage5a-workspace.tar.gz" > "$RUNNER_TEMP/stage5a-workspace.tar.gz.sha256"
      - name: Upload local workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage5a-workspace-11e2333
          path: |
            ${{ runner.temp }}/stage5a-workspace.tar.gz
            ${{ runner.temp }}/stage5a-workspace.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
