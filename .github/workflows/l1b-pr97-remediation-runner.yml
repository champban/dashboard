# Temporary build-only runner for the approved PR #97 P2 remediation.
# Never merge. No secrets, Environment, Production or provider access.
name: L1B PR97 remediation runner v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/l1b-pr97-remediation-runner.yml"
      - "ops/l1b-pr97-remediation-parts/part-002.patchpart.gz"
      - "ops/l1b-pr97-remediation-parts/part-003.patchpart.gz"

permissions:
  contents: read

jobs:
  build-remediated-one-commit:
    name: Build and export verified PR97 candidate v3
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/l1b-pr97-source-export'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact orchestration head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct, test and freeze exact candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PATCH_SHA='31780b84f11dd3391dfb69b45f8ddb0f4ebfea2a70d15e8ffeee13f8937685ec'
          EXPECTED_PATCH_BYTES='25391'
          EXPECTED_GZ2_SHA='0c6b601f64ba2c03a079f6040e3ee02d44057b87b840f6852553f9fe33d98589'
          EXPECTED_RAW2_SHA='dd662993f8baf0e57fe4e1741a804d0a18e3cac9f33a324f93b40731810cda7d'
          EXPECTED_GZ3_SHA='ba2847c3cf86c967dee136c0ef7a2dea2398d261ab6993f549b0d01bb7849bf3'
          EXPECTED_RAW3_SHA='60e65ea35b3c4af504c4f50059a67d340f04838102e5500332964f938584c83d'
          PART_DIR='ops/l1b-pr97-remediation-parts'
          PATCH_FILE="$RUNNER_TEMP/l1b-pr97-remediation.patch"
          APPLY_SCRIPT="$RUNNER_TEMP/l1b-pr97-apply.sh"

          [[ "$GITHUB_REPOSITORY" == 'champban/dashboard' ]]
          [[ "$GITHUB_BASE_REF" == 'main' ]]
          [[ "$GITHUB_HEAD_REF" == 'ops/l1b-pr97-source-export' ]]

          : > "$PATCH_FILE"
          chmod 600 "$PATCH_FILE"
          for index in 000 001 002 003 004 005 006; do
            raw="$RUNNER_TEMP/part-$index.raw"
            if [[ "$index" == '002' || "$index" == '003' ]]; then
              gz="$PART_DIR/part-$index.patchpart.gz"
              [[ -f "$gz" && ! -L "$gz" ]]
              gz_actual="$(sha256sum "$gz" | awk '{print $1}')"
              if [[ "$index" == '002' ]]; then
                [[ "$gz_actual" == "$EXPECTED_GZ2_SHA" ]]
              else
                [[ "$gz_actual" == "$EXPECTED_GZ3_SHA" ]]
              fi
              gzip -dc "$gz" > "$raw"
            else
              part="$PART_DIR/part-$index.b64"
              [[ -f "$part" && ! -L "$part" ]]
              base64 --decode "$part" > "$raw"
            fi
            chmod 600 "$raw"
            raw_actual="$(sha256sum "$raw" | awk '{print $1}')"
            if [[ "$index" == '002' ]]; then
              [[ "$raw_actual" == "$EXPECTED_RAW2_SHA" ]]
            elif [[ "$index" == '003' ]]; then
              [[ "$raw_actual" == "$EXPECTED_RAW3_SHA" ]]
            fi
            cat "$raw" >> "$PATCH_FILE"
          done
          [[ "$(stat -c '%s' "$PATCH_FILE")" == "$EXPECTED_PATCH_BYTES" ]]
          [[ "$(sha256sum "$PATCH_FILE" | awk '{print $1}')" == "$EXPECTED_PATCH_SHA" ]]

          python3 - "$APPLY_SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          source = Path('.github/workflows/l1b-pr97-source-export.yml').read_text(encoding='utf-8').splitlines()
          step = '      - name: Apply patch to exact reviewed head'
          start = source.index(step)
          run_start = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          body = []
          for line in source[run_start + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise SystemExit(f'unexpected YAML indentation while extracting build script: {line!r}')
          payload = '\n'.join(body) + '\n'
          old = '''git push origin "$NEW_COMMIT:refs/heads/$STAGING_BRANCH" --force
          [[ "$(git ls-remote origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')" == "$NEW_COMMIT" ]]
          '''
          if payload.count(old) != 1:
              raise SystemExit('unable to replace the prohibited workflow-file push block exactly once')
          payload = payload.replace(
              old,
              '''printf '%s\\n' "$NEW_COMMIT" > "$RUNNER_TEMP/l1b-pr97-new-commit"\nprintf '%s\\n' "$TREE" > "$RUNNER_TEMP/l1b-pr97-new-tree"\n''',
              1,
          )
          if "BASE='297854c09205097a6a58cbce4c64961c802cd7a3'" not in payload:
              raise SystemExit('frozen build script extraction failed')
          Path(sys.argv[1]).write_text(payload, encoding='utf-8')
          PY
          chmod 700 "$APPLY_SCRIPT"
          bash -n "$APPLY_SCRIPT"
          PATCH_FILE="$PATCH_FILE" bash "$APPLY_SCRIPT"

          NEW_COMMIT="$(cat "$RUNNER_TEMP/l1b-pr97-new-commit")"
          NEW_TREE="$(cat "$RUNNER_TEMP/l1b-pr97-new-tree")"
          [[ "$NEW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEW_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "$NEW_COMMIT^{tree}")" == "$NEW_TREE" ]]
          echo "new_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "new_tree=$NEW_TREE" >> "$GITHUB_OUTPUT"
          echo "L1B_PR97_BUILT_COMMIT=$NEW_COMMIT"
          echo "L1B_PR97_BUILT_TREE=$NEW_TREE"

          OUT="$RUNNER_TEMP/pr97-remediated-source"
          mkdir -p "$OUT/.github/workflows" "$OUT/docs" "$OUT/ops"
          chmod 700 "$OUT"
          files=(
            '.github/workflows/l1b-post-import-isolated-restore.yml'
            'docs/L1B_POST_IMPORT_RESTORE.md'
            'ops/l1b-post-import-isolated-restore-acl-check.sh'
            'ops/l1b-post-import-isolated-restore-acl-patch.py'
            'ops/l1b-post-import-isolated-restore-aicc-check.py'
            'ops/l1b-post-import-isolated-restore-check.py'
            'ops/l1b-post-import-isolated-restore-core.sh'
            'ops/l1b-post-import-isolated-restore-count-check.py'
            'ops/l1b-post-import-isolated-restore-review-check.sh'
            'ops/l1b-post-import-isolated-restore-stdin-patch.py'
            'ops/l1b-post-import-isolated-restore-telemetry.sh'
            'ops/l1b-post-import-isolated-restore.sh'
          )
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]]
            cp --parents "$file" "$OUT"
            chmod 600 "$OUT/$file"
          done
          {
            echo "base=297854c09205097a6a58cbce4c64961c802cd7a3"
            echo "superseded_head=147d0926b3ea8f3f6711bc7025d2252ec55e41c3"
            echo "built_commit=$NEW_COMMIT"
            echo "built_tree=$NEW_TREE"
            echo "patch_sha256=$EXPECTED_PATCH_SHA"
            echo "file_count=${#files[@]}"
            for file in "${files[@]}"; do
              printf '%s\t%s\t%s\t%s\n' \
                "$(sha256sum "$file" | awk '{print $1}')" \
                "$(git hash-object "$file")" \
                "$(stat -c '%s' "$file")" \
                "$file"
            done
          } > "$OUT/CANDIDATE-MANIFEST.tsv"
          chmod 600 "$OUT/CANDIDATE-MANIFEST.tsv"
          [[ "$(find "$OUT" -type f | wc -l | tr -d ' ')" == '13' ]]

      - name: Upload exact verified candidate for connector commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-pr97-remediated-${{ github.run_id }}
          path: ${{ runner.temp }}/pr97-remediated-source
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true

      - name: Publish bounded build evidence
        shell: bash
        run: |
          {
            echo '## L1B PR #97 exact verified candidate transfer'
            echo
            echo "- Base: \`297854c09205097a6a58cbce4c64961c802cd7a3\`"
            echo "- Built local commit: \`${{ steps.build.outputs.new_commit }}\`"
            echo "- Built tree: \`${{ steps.build.outputs.new_tree }}\`"
            echo '- Patch SHA-256: `31780b84f11dd3391dfb69b45f8ddb0f4ebfea2a70d15e8ffeee13f8937685ec`'
            echo '- npm test / verify / secret scan and B-2 source selftests: **PASS**'
            echo '- Candidate exported for connector-side exact commit; target PR branch unchanged by this runner.'
            echo '- Production effect: **NONE**'
          } >> "$GITHUB_STEP_SUMMARY"
