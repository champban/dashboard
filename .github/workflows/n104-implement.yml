name: N104 implementation pipeline

on:
  push:
    branches:
      - fix/n104-ios-drive-file-list

permissions:
  contents: write

jobs:
  implement-test-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout N104 branch
        uses: actions/checkout@v4
        with:
          ref: fix/n104-ios-drive-file-list
          fetch-depth: 0

      - name: Patch N104 source and documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global app
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              app = app.replace(old, new, 1)

          old_loader = '''  let gisReady = false;

  const loadGIS = () => new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) { gisReady = true; return resolve(); }
    const existing = document.getElementById("gis-script");
    if (existing) { existing.addEventListener("load", () => resolve()); return; }
    const s = document.createElement("script");
    s.id = "gis-script";
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => { gisReady = true; resolve(); };
    s.onerror = () => reject(new Error("Could not load Google sign-in. Check your connection."));
    document.head.appendChild(s);
  });'''
          new_loader = '''  let gisReady = false;
  let gisLoadPromise = null;
  const GIS_LOAD_TIMEOUT_MS = 10000;

  // N104: iOS Safari can leave an existing GIS <script> in the DOM without ever
  // firing another load event. Bound every attempt, remove a stale script, then
  // retry once so Connect never hangs indefinitely.
  const loadGISAttempt = (forceNew=false) => new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) { gisReady = true; return resolve(); }
    let s = document.getElementById("gis-script");
    if (forceNew && s) { s.remove(); s = null; }
    if (!s) {
      s = document.createElement("script");
      s.id = "gis-script";
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    }
    let settled = false;
    let timer = null;
    const finish = (fn, value) => {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      s.removeEventListener("load", onLoad);
      s.removeEventListener("error", onError);
      fn(value);
    };
    const onLoad = () => window.google?.accounts?.oauth2
      ? finish(resolve)
      : finish(reject, new Error("Google sign-in loaded but is unavailable. Please retry."));
    const onError = () => finish(reject, new Error("Could not load Google sign-in. Check your connection."));
    s.addEventListener("load", onLoad, {once:true});
    s.addEventListener("error", onError, {once:true});
    timer = setTimeout(() => finish(reject, new Error("Google sign-in timed out. Check Safari content blockers, then retry.")), GIS_LOAD_TIMEOUT_MS);
  });

  const loadGIS = () => {
    if (window.google?.accounts?.oauth2) { gisReady = true; return Promise.resolve(); }
    if (gisLoadPromise) return gisLoadPromise;
    gisLoadPromise = (async()=>{
      try { await loadGISAttempt(false); }
      catch { await loadGISAttempt(true); }
      gisReady = true;
    })().finally(()=>{ gisLoadPromise = null; });
    return gisLoadPromise;
  };'''
          replace_once(old_loader, new_loader, 'GIS loader')

          old_token = '''  const ensureToken = async () => {
    if (accessToken && Date.now() < tokenExpiry) return accessToken;
    return signIn({}); // interactive if needed
  };'''
          new_token = '''  const reconnectRequiredError = () => {
    const err = new Error("Google Drive session expired — reconnect to continue.");
    err.code = "GDRIVE_RECONNECT_REQUIRED";
    return err;
  };

  const ensureToken = async () => {
    if (accessToken && Date.now() < tokenExpiry) return accessToken;
    accessToken = null; tokenExpiry = 0;
    // N104: never start an OAuth popup from inside a nested API request. iOS may
    // block it after user activation is lost; the UI now exposes Reconnect.
    throw reconnectRequiredError();
  };'''
          replace_once(old_token, new_token, 'token expiry handling')

          replace_once(
              '    if (res.status === 401) { accessToken=null; throw new Error("Google session expired — please reconnect."); }',
              '    if (res.status === 401) { accessToken=null; tokenExpiry=0; throw reconnectRequiredError(); }',
              'Drive 401 handling'
          )

          replace_once(
              '  const [files, setFiles] = React.useState(null);\n  const [renaming, setRenaming] = React.useState(false);',
              '  const [files, setFiles] = React.useState(null);\n  const [listError, setListError] = React.useState("");\n  const [renaming, setRenaming] = React.useState(false);',
              'SyncPanel list error state'
          )

          replace_once(
              '  const doConnect = async()=>{ setBusy(true); await onConnect(); setBusy(false); };\n  const loadList  = async()=>{ setBusy(true); try{ setFiles(await listFiles()); }catch{} setBusy(false); };',
              '''  const doConnect = async()=>{ setBusy(true); try{ await onConnect(); } finally { setBusy(false); } };
  const loadList = async()=>{
    setBusy(true); setListError("");
    try { setFiles(await listFiles()); }
    catch(e) { setFiles(null); setListError(e?.message || "Could not list Google Drive files."); }
    finally { setBusy(false); }
  };
  const reconnectAndReload = async()=>{
    setBusy(true); setListError("");
    try {
      const ok = await onConnect();
      if (ok===false) throw new Error("Could not reconnect Google Drive.");
      setFiles(await listFiles());
    } catch(e) { setFiles(null); setListError(e?.message || "Could not reconnect Google Drive."); }
    finally { setBusy(false); }
  };''',
              'SyncPanel handlers'
          )

          sync_files_block = '''              {files && (
                <div style={{marginTop:8,border:"1px solid var(--c-border)",borderRadius:7,overflow:"hidden",maxHeight:150,overflowY:"auto"}}>
                  {files.length===0 && <div style={{padding:9,fontSize:11,color:"var(--c-text-muted)",textAlign:"center"}}>No .json files on Drive.</div>}
                  {files.map(f=>(
                    <button key={f.id} onClick={()=>pick(f)}
                      style={{display:"block",width:"100%",textAlign:"left",padding:"7px 10px",border:"none",borderBottom:"1px solid var(--c-border)",background:"var(--c-surface)",color:"var(--c-text)",fontSize:11,cursor:"pointer"}}>
                      📄 {f.name}<span style={{display:"block",fontSize:9,color:"var(--c-text-muted)"}}>{new Date(f.modifiedTime).toLocaleString()}</span>
                    </button>
                  ))}
                </div>
              )}'''
          sync_files_new = sync_files_block + '''
              {listError && (
                <div style={{marginTop:8,padding:"8px 9px",borderRadius:7,background:"#7f1d1d22",border:"1px solid #7f1d1d55",color:"#fca5a5",fontSize:10.5,lineHeight:1.5}}>
                  <div>⚠️ {listError}</div>
                  <button onClick={reconnectAndReload} disabled={busy}
                    style={{marginTop:7,padding:"6px 10px",borderRadius:7,border:"none",background:"#1a73e8",color:"#fff",fontSize:10.5,fontWeight:800,cursor:"pointer"}}>
                    🔄 Reconnect Google Drive
                  </button>
                </div>
              )}
              <div style={{marginTop:8,fontSize:9.5,color:"var(--c-text-muted)",lineHeight:1.45}}>
                ℹ️ drive.file scope: only files created by or previously authorized for this app are shown — not every file in Drive.
              </div>'''
          replace_once(sync_files_block, sync_files_new, 'SyncPanel files UI')

          replace_once(
              '  const [files, setFiles] = React.useState(null); // null = not loaded, [] = loaded empty\n  const linked = !!gsync?.fileId;',
              '  const [files, setFiles] = React.useState(null); // null = not loaded, [] = loaded empty\n  const [listError, setListError] = React.useState("");\n  const linked = !!gsync?.fileId;',
              'CloudSyncModal list error state'
          )

          replace_once(
              '''  const doConnect = async () => { setBusy(true); await onConnect(); setBusy(false); };
  const doPickFile = async () => {
    setBusy(true);
    try { const list = await listFiles(); setFiles(list); }
    catch(e){ /* surfaced via status */ }
    setBusy(false);
  };''',
              '''  const doConnect = async () => { setBusy(true); try{ await onConnect(); } finally { setBusy(false); } };
  const doPickFile = async () => {
    setBusy(true); setListError("");
    try { const list = await listFiles(); setFiles(list); }
    catch(e){ setFiles(null); setListError(e?.message || "Could not list Google Drive files."); }
    finally { setBusy(false); }
  };
  const reconnectAndPick = async () => {
    setBusy(true); setListError("");
    try {
      const ok = await onConnect();
      if (ok===false) throw new Error("Could not reconnect Google Drive.");
      setFiles(await listFiles());
    } catch(e) { setFiles(null); setListError(e?.message || "Could not reconnect Google Drive."); }
    finally { setBusy(false); }
  };''',
              'CloudSyncModal handlers'
          )

          modal_link_button = '''              <button onClick={doPickFile} disabled={busy}
                style={{width:"100%",padding:"11px 0",borderRadius:10,border:"1.5px solid var(--c-border)",background:"var(--c-surface)",
                  color:"var(--c-text)",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                📂 Link an existing file
              </button>'''
          modal_link_new = modal_link_button + '''
              {listError && (
                <div style={{marginTop:10,padding:"9px 11px",borderRadius:8,background:"#7f1d1d22",border:"1px solid #7f1d1d55",color:"#fca5a5",fontSize:11,lineHeight:1.5}}>
                  <div>⚠️ {listError}</div>
                  <button onClick={reconnectAndPick} disabled={busy}
                    style={{marginTop:8,padding:"7px 11px",borderRadius:7,border:"none",background:"#1a73e8",color:"#fff",fontSize:11,fontWeight:800,cursor:"pointer"}}>
                    🔄 Reconnect Google Drive
                  </button>
                </div>
              )}
              <div style={{marginTop:9,fontSize:10,color:"var(--c-text-muted)",lineHeight:1.5}}>
                ℹ️ drive.file scope: only files created by or previously authorized for this app are shown — not every file in Drive.
              </div>'''
          replace_once(modal_link_button, modal_link_new, 'CloudSyncModal reconnect UI')

          disconnect_anchor = '''  const gsyncDisconnect = () => {
    GDrive.signOut({forget:true}); setGsyncSignedIn(false); setGsyncStatus("idle");'''
          disconnect_new = '''  // N104: one guarded entry point for both Drive file-list UIs. It updates the
  // parent auth/status state before rethrowing so a stale token cannot look connected.
  const gsyncListFiles = async () => {
    if (typeof navigator!=="undefined" && navigator.onLine===false) {
      const err = new Error("You are offline — reconnect to the internet and retry.");
      setGsyncStatus("offline"); setGsyncError(err.message);
      throw err;
    }
    setGsyncError("");
    try { return await GDrive.listFiles(); }
    catch(e) {
      const msg = e?.message || "Could not list Google Drive files.";
      if (e?.code==="GDRIVE_RECONNECT_REQUIRED" || /session expired|reconnect/i.test(msg)) setGsyncSignedIn(false);
      setGsyncStatus("error"); setGsyncError(msg);
      throw e;
    }
  };

  const gsyncDisconnect = () => {
    GDrive.signOut({forget:true}); setGsyncSignedIn(false); setGsyncStatus("idle");'''
          replace_once(disconnect_anchor, disconnect_new, 'App listFiles guard')

          count_signed = app.count('gsyncSignedIn={gsyncSignedIn||GDrive.isSignedIn()}')
          if count_signed != 2:
              raise SystemExit(f'signed-in prop: expected 2, found {count_signed}')
          app = app.replace('gsyncSignedIn={gsyncSignedIn||GDrive.isSignedIn()}', 'gsyncSignedIn={gsyncSignedIn&&GDrive.isSignedIn()}')

          count_lists = app.count('listFiles={()=>GDrive.listFiles()}')
          if count_lists != 2:
              raise SystemExit(f'listFiles prop: expected 2, found {count_lists}')
          app = app.replace('listFiles={()=>GDrive.listFiles()}', 'listFiles={gsyncListFiles}')

          app_path.write_text(app, encoding='utf-8')

          # Prevention and incident status. N104 remains open until physical iOS verification.
          ctx_path = Path('PROJECT_CONTEXT.md')
          ctx = ctx_path.read_text(encoding='utf-8')
          ctx = ctx.replace(
              '| N104 | Cannot pick a Drive file on iOS | Reproduce and capture the error; `listFiles()` may fail silently in mobile Safari. |',
              '| N104 | Cannot pick a Drive file on iOS | Fix implemented on `fix/n104-ios-drive-file-list`: visible list errors, explicit reconnect, bounded GIS retry, and `drive.file` scope guidance. Pending physical iOS Safari/PWA verification. |'
          )
          hazard = '- Drive file-list errors must never use an empty `catch`; token expiry must surface an explicit Reconnect action instead of starting nested OAuth from an API helper.\n'
          marker = '## Open backlog\n'
          if hazard not in ctx:
              ctx = ctx.replace(marker, '## N104 prevention control\n\n' + hazard + '\n' + marker)
          register = '''

## Prevented Recurrence Register

| ID | Symptom | Root cause | Fix | Prevention control | Automated test/check | Commit/Deploy | Status |
|---|---|---|---|---|---|---|---|
| N104 | iOS Drive Link/Change file appears to do nothing | Expired in-memory token could start nested OAuth from `listFiles()`; both file-list UIs swallowed the resulting error | Explicit reconnect path, visible classified error, GIS timeout/retry, accurate auth-state propagation | No empty catch on Drive list; API helper never opens interactive OAuth; scope limitation shown | Build + jsdom render harness + 6D source audit + static N104 assertions | Branch `fix/n104-ios-drive-file-list`; production pending | Implemented — pending physical iOS verification |
'''
          if '## Prevented Recurrence Register' not in ctx:
              ctx += register
          ctx_path.write_text(ctx, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          cl = changelog.read_text(encoding='utf-8')
          entry = '''## Unreleased — N104 iOS Drive file selection

- Drive file-list errors are now visible instead of silently swallowed.
- Expired Google sessions show an explicit Reconnect action; API helpers no longer initiate nested OAuth popups.
- Google Identity Services loading has a 10-second timeout and one clean retry.
- Sync UI explains that `drive.file` lists only app-authorized files, not the entire Drive.

'''
          if '## Unreleased — N104 iOS Drive file selection' not in cl:
              changelog.write_text(entry + cl, encoding='utf-8')

          # Static regression assertions before dependency installation.
          final = app_path.read_text(encoding='utf-8')
          required = [
              'GDRIVE_RECONNECT_REQUIRED',
              'Google sign-in timed out',
              'Reconnect Google Drive',
              'drive.file scope: only files created by or previously authorized',
              'listFiles={gsyncListFiles}',
          ]
          for token in required:
              if token not in final:
                  raise SystemExit(f'missing N104 prevention token: {token}')
          if 'const loadList  = async()=>{ setBusy(true); try{ setFiles(await listFiles()); }catch{}' in final:
              raise SystemExit('silent SyncPanel catch still present')
          if 'catch(e){ /* surfaced via status */ }' in final:
              raise SystemExit('silent CloudSyncModal catch still present')
          print('N104 source patch and static assertions: PASS')
          PY

      - name: Install pinned temporary build toolchain
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "@vitejs/plugin-react": "4.3.4",
              "esbuild": "0.24.2",
              "jsdom": "25.0.1",
              "react": "18.3.1",
              "react-dom": "18.3.1",
              "vite": "5.4.21"
            }
          }
          EOF
          npm install --no-audit --no-fund
          cat > .n104-entry.html <<'EOF'
          <!doctype html><html><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
          EOF
          cat > vite.config.mjs <<'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({
            plugins: [react()],
            build: {
              target: ['es2019','safari13'],
              cssCodeSplit: false,
              rollupOptions: { input: '.n104-entry.html', output: { inlineDynamicImports: true } }
            }
          });
          EOF

      - name: Build render harness audit and package
        shell: bash
        run: |
          npx vite build --config vite.config.mjs
          BUNDLE="$(find dist/assets -type f -name '*.js' | head -n 1)"
          test -n "$BUNDLE"
          npx esbuild src/main.jsx --bundle --format=iife --loader:.jsx=jsx --jsx=automatic --target=es2019 --define:process.env.NODE_ENV='"production"' --outfile=test-bundle.js
          node build/check4.mjs | tee n104-harness.log
          ! grep -q '^THROW:' n104-harness.log
          grep -Eq '^LEN [1-9][0-9]*' n104-harness.log
          python3 build/audit.py src/App.jsx | tee n104-audit.log
          ! grep -Eqi 'blockers?:[[:space:]]*[1-9]|BLOCKED' n104-audit.log
          node build/package.mjs "$BUNDLE" index.html 3.77.0 | tee n104-package.log
          grep -q 'verify: PASS' n104-package.log
          test "$(grep -o '\?\?' index.html | wc -l)" -eq 0
          test "$(grep -o '\?\.\[' index.html | wc -l)" -eq 0

      - name: Refresh build manifest
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          p = Path('BUILD-MANIFEST.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          raw = Path('index.html').read_bytes()
          data['date'] = '2026-07-25'
          data['full']['sha256'] = hashlib.sha256(raw).hexdigest()
          data['full']['bytes'] = len(raw)
          data['source']['note'] = 'index.html is generated; N104 source fix built, audited and packaged from src/App.jsx'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary toolchain and commit verified N104 output
        shell: bash
        run: |
          rm -rf node_modules dist package.json package-lock.json vite.config.mjs .n104-entry.html test-bundle.js n104-harness.log n104-audit.log n104-package.log
          git rm .github/workflows/n104-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx PROJECT_CONTEXT.md CHANGELOG.md BUILD-MANIFEST.json index.html
          git diff --cached --check
          git commit -m "fix: harden iOS Drive file selection (N104)"
          git push origin HEAD:fix/n104-ios-drive-file-list
