name: Stage 5A temporary-tool cleanup

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'ops(stage5a): cleanup remediation tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Stage 5A branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate remediated source and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/feature/stage5a-line-import-conflict' ]]
          test "$(git log -2 --format=%s | grep -c '^fix(stage5a): make cloud completion retries idempotent$')" -eq 1
          test -f ops/stage5a-five-findings.py
          test -f .github/workflows/stage5a-five-findings.yml
          test -f .github/workflows/stage5a-cleanup.yml
          git rm ops/stage5a-five-findings.py \
            .github/workflows/stage5a-five-findings.yml \
            .github/workflows/stage5a-cleanup.yml
          git config user.name 'P Boy Stage5A Automation'
          git config user.email 'champbanyat@gmail.com'
          git commit -m 'chore(stage5a): remove temporary remediation tooling'
          git push origin HEAD:feature/stage5a-line-import-conflict
