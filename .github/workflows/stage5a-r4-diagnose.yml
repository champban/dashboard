name: Stage 5A round 4 test diagnosis

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-r4-diagnose.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate trigger and unchanged approved source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git log -1 --format=%s)" == "ops(stage5a): diagnose regression failure" ]]
          git merge-base --is-ancestor 921a7d780713dead2ab1c8b554dddaad0c59b4d2 HEAD
          git diff --quiet 921a7d780713dead2ab1c8b554dddaad0c59b4d2 -- \
            BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx \
            package.json package-lock.json .github/workflows/verify.yml

      - name: Apply exact in-run patch
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            0cb1a6df61217ce044f4cc5dd506176099a6b6e1d637b3446c8a87207924d7be
            6a9f6f2dff7a9044e15794895f513985640124819bfc2556347204ae82324516
            0e9614ed20a6d2be81828cb40d74bb47961b05bc384e31807862f9034fcb71b4
            3f5721f43eea4b54574e8b9da9d7807cbf61d5fda62aca30558cf651e97fc8c4
          )
          : > "$RUNNER_TEMP/patch.b64"
          for i in 0 1 2 3; do
            tr -d '[:space:]' < ".stage5a-r4/bin${i}.b64" > "$RUNNER_TEMP/bin${i}.b64"
            [[ "$(sha256sum "$RUNNER_TEMP/bin${i}.b64" | cut -d' ' -f1)" == "${expected[$i]}" ]]
            cat "$RUNNER_TEMP/bin${i}.b64" >> "$RUNNER_TEMP/patch.b64"
          done
          [[ "$(sha256sum "$RUNNER_TEMP/patch.b64" | cut -d' ' -f1)" == "4aa90f9ae9758b0959aab589922bcd11c72454faf52660bb181e66f0affe55fb" ]]
          base64 -d "$RUNNER_TEMP/patch.b64" | gzip -d > "$RUNNER_TEMP/stage5a-r4.py"
          [[ "$(sha256sum "$RUNNER_TEMP/stage5a-r4.py" | cut -d' ' -f1)" == "fac74c75081bd1155f60f720e6ff7d98ada9208e1c2a1f82f99ee163812860a5" ]]
          python3 "$RUNNER_TEMP/stage5a-r4.py"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and post focused result
        id: tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          tail -n 160 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test-tail.log"
          python3 - "$rc" "$RUNNER_TEMP/test-tail.log" > "$RUNNER_TEMP/body.json" <<'PYCODE'
          import json,sys
          rc=sys.argv[1]
          tail=open(sys.argv[2],encoding='utf-8',errors='replace').read()
          body=(f"STAGE5A_R4_TEST_DIAGNOSTIC rc={rc}\n\n"
                "```text\n"+tail[-12000:]+"\n```")
          print(json.dumps({'body':body}))
          PYCODE
          gh api "repos/$GITHUB_REPOSITORY/issues/105/comments" \
            --method POST --input "$RUNNER_TEMP/body.json" >/dev/null
          exit "$rc"
