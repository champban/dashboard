name: Stage 5A second-review remediation

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-review2-remediate.yml

permissions:
  contents: write

concurrency:
  group: stage5a-review2-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate trigger, branch and approved base
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/feature/stage5a-line-import-conflict' ]]
          [[ "$(git log -1 --format=%s)" == 'ops(stage5a): recalculate Mobile CSP' ]]
          git merge-base --is-ancestor 29746ce2c0f9f5ba7298555d5ed7bb5f56ce05c3 HEAD
          [[ -f ops/stage5a-review2-remediate.py ]]
          python3 -m py_compile ops/stage5a-review2-remediate.py

      - name: Apply deterministic four-finding remediation
        run: python3 ops/stage5a-review2-remediate.py

      - name: Correct generated line-contract newline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('build/line-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          bad = 'const at=full.indexOf(marker),end=full.indexOf("' + '\n' + '  };",at);'
          good = r'const at=full.indexOf(marker),end=full.indexOf("\n  };",at);'
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'generated line-contract anchor drifted: {count} matches')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PYCODE

      - name: Recalculate Mobile inline CSP hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64
          import hashlib
          import re
          from pathlib import Path

          path = Path('mobile/index.html')
          text = path.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', text)
          if not scripts:
              raise SystemExit('no Mobile inline scripts found')
          hashes = []
          for script in scripts:
              value = base64.b64encode(hashlib.sha256(script.encode('utf-8')).digest()).decode('ascii')
              if value not in hashes:
                  hashes.append(value)

          pattern = re.compile(r'(<meta http-equiv="Content-Security-Policy" content=")([^"]+)(">)')
          match = pattern.search(text)
          if not match:
              raise SystemExit('Mobile CSP meta tag not found')
          directives = [part.strip() for part in match.group(2).split(';') if part.strip()]
          updated = False
          for index, directive in enumerate(directives):
              tokens = directive.split()
              if tokens and tokens[0] == 'script-src':
                  base_tokens = [token for token in tokens if not token.startswith("'sha256-")]
                  directives[index] = ' '.join(base_tokens + [f"'sha256-{value}'" for value in hashes])
                  updated = True
                  break
          if not updated:
              raise SystemExit('Mobile script-src directive not found')
          content = '; '.join(directives)
          text = text[:match.start(2)] + content + text[match.end(2):]
          path.write_text(text, encoding='utf-8')
          print(f'Mobile CSP refreshed for {len(scripts)} inline scripts / {len(hashes)} unique hashes')
          PYCODE

      - name: Validate source-only boundary before build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/actual.txt"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and refresh generated package
        run: npm run build && npm run package

      - name: Run regression tests
        run: npm test

      - name: Verify build and generated package
        run: npm run verify

      - name: Scan secrets
        run: npm run scan-secrets

      - name: Validate final boundary and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final.txt"
          cat > "$RUNNER_TEMP/allowed-final.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed-final.txt" "$RUNNER_TEMP/final.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/final.txt"

      - name: Commit and push verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P Boy Stage5A Automation'
          git config user.email 'champbanyat@gmail.com'
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && { echo 'No remediation changes staged'; exit 1; }
          git commit -m 'fix(stage5a): close second exact-head review findings'
          git push origin HEAD:feature/stage5a-line-import-conflict
