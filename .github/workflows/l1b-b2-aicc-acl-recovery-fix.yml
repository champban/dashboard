name: L1B B-2 AICC ACL recovery fix

on:
  push:
    branches: [ops/l1b-b2-aicc-acl-recovery-fix]
    paths:
      - .github/workflows/l1b-b2-aicc-acl-recovery-fix.yml
      - ops/l1b-b2-aicc-acl-recovery-fix.sh

permissions:
  actions: read
  contents: read

concurrency:
  group: l1b-b2-aicc-acl-recovery-fix
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY_ID: '1297538303'
  EXPECTED_BASE_SHA: 297854c09205097a6a58cbce4c64961c802cd7a3
  EXPECTED_REF: refs/heads/ops/l1b-b2-aicc-acl-recovery-fix
  EXPECTED_TARGET_HEAD: fe1e175ac1b95b1dbf2f2813171d65376cd4c402
  EXPECTED_FIX_BLOB: 55fc12f22741d8e8bac1cb011b6994cacc9f5681
  EXPECTED_PROJECT_REF: qjaywadzvwvcspdsjxth
  EXPECTED_BACKUP_HEAD_REF: ops/l1b-post-import-backup-refresh
  EXPECTED_SOURCE_SHA: 25508b077a7ee81c1b6b6f42da2dbd704a7f247f
  EXPECTED_DB_IMAGE: supabase/postgres@sha256:ca7871b587ca2c401ac0f325df6249c9aa0d25647ded34631158efc51176767f
  EXPECTED_BACKUP_RUN_ID: '33409097769'
  EXPECTED_ARTIFACT_ID: '9805484584'
  EXPECTED_ARTIFACT_NAME: dashboard-l1b-post-import-backup-20260901T143601Z
  EXPECTED_ARTIFACT_CREATED_AT: '2026-09-01T14:37:11Z'
  EXPECTED_ARTIFACT_EXPIRES_AT: '2026-09-02T14:37:10Z'
  EXPECTED_ARTIFACT_ZIP_BYTES: '56347'
  EXPECTED_ARTIFACT_ZIP_SHA256: 57a64b3e0276b7f5d431b2374576a3c64f8137b012499d6a280c936d27bbdb60
  EXPECTED_BACKUP_STAMP: '20260901T143601Z'
  EXPECTED_ARCHIVE_BYTES: '54950'
  EXPECTED_ARCHIVE_SHA256: 1d563664b953938480691a49e30a3c4da286b0b38cf48666774e2c37676d93fa
  EXPECTED_ROLES_SHA256: 25873cec56a2cc6514e204f420231777f85c03da818caa7090cdcdfa89776ecd
  EXPECTED_SCHEMA_SHA256: 645e07100834b1e50da3baeeddd9a9a56c59474620a0ec1864d94bfe5ae7a46e
  EXPECTED_DATA_SHA256: d4a11ed056b9572900bf9076d1cbba816356ec02f158a9ab8f7de96aa41a1eda

jobs:
  source-safety:
    name: Recovery fix source contract
    if: github.repository == 'champban/dashboard' && github.ref == 'refs/heads/ops/l1b-b2-aicc-acl-recovery-fix' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fix source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: fix
      - name: Checkout exact reviewed B-2 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fe1e175ac1b95b1dbf2f2813171d65376cd4c402
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Validate boundary and exact source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.repository_id }}" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "${{ github.ref }}" == "$EXPECTED_REF" ]]
          [[ "${{ github.run_attempt }}" == '1' ]]
          [[ "$(git -C fix merge-base "$EXPECTED_BASE_SHA" HEAD)" == "$EXPECTED_BASE_SHA" ]]
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/l1b-b2-aicc-acl-recovery-fix.yml
          ops/l1b-b2-aicc-acl-recovery-fix.sh
          EOF
          git -C fix diff --name-only "$EXPECTED_BASE_SHA"...HEAD | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          [[ "$(git -C fix hash-object ops/l1b-b2-aicc-acl-recovery-fix.sh)" == "$EXPECTED_FIX_BLOB" ]]
          [[ "$(git -C target rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          bash -n fix/ops/l1b-b2-aicc-acl-recovery-fix.sh
          python3 - <<'PY'
          from pathlib import Path
          w=Path('fix/.github/workflows/l1b-b2-aicc-acl-recovery-fix.yml').read_text()
          s=Path('fix/ops/l1b-b2-aicc-acl-recovery-fix.sh').read_text()
          forbidden=('workflow_'+'dispatch:', 'pull_request_'+'target:', 'SUPABASE_'+'DB_URL', 'DATABASE_'+'URL', 'actions/'+'upload-artifact', 'supabase db '+'push')
          if any(x in w or x in s for x in forbidden): raise SystemExit('forbidden capability')
          if sum(line.strip()=='environment: production-backup' for line in w.splitlines())!=1:
              raise SystemExit('Environment gate mismatch')
          PY
      - name: Apply exact fix and run source selftests
        shell: bash
        run: |
          set -euo pipefail
          bash fix/ops/l1b-b2-aicc-acl-recovery-fix.sh target | tee "$RUNNER_TEMP/result.txt"
          grep -Fxq 'L1B_B2_AICC_ACL_RECOVERY_FIX=PASS' "$RUNNER_TEMP/result.txt"
          rm -f -- "$RUNNER_TEMP/result.txt" "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          echo 'L1B_B2_AICC_ACL_RECOVERY_FIX_SOURCE=PASS'

  isolated-restore:
    name: Recovery test — isolated restore
    if: github.repository == 'champban/dashboard' && github.ref == 'refs/heads/ops/l1b-b2-aicc-acl-recovery-fix' && github.run_attempt == 1
    needs: source-safety
    environment: production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact fix source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: fix
      - name: Checkout exact reviewed B-2 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fe1e175ac1b95b1dbf2f2813171d65376cd4c402
          fetch-depth: 0
          persist-credentials: false
          path: target
      - name: Apply exact recovery fix
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.repository_id }}" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "${{ github.ref }}" == "$EXPECTED_REF" ]]
          [[ "${{ github.run_attempt }}" == '1' ]]
          [[ "$(git -C fix merge-base "$EXPECTED_BASE_SHA" HEAD)" == "$EXPECTED_BASE_SHA" ]]
          [[ "$(git -C fix hash-object ops/l1b-b2-aicc-acl-recovery-fix.sh)" == "$EXPECTED_FIX_BLOB" ]]
          [[ "$(git -C target rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          bash fix/ops/l1b-b2-aicc-acl-recovery-fix.sh target | tee "$RUNNER_TEMP/result.txt"
          grep -Fxq 'L1B_B2_AICC_ACL_RECOVERY_FIX=PASS' "$RUNNER_TEMP/result.txt"
          rm -f -- "$RUNNER_TEMP/result.txt"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b
        with:
          version: 2.111.0
      - name: Verify pinned disposable tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(supabase --version)" == '2.111.0' ]]
          [[ "$EXPECTED_DB_IMAGE" =~ ^supabase/postgres@sha256:[0-9a-f]{64}$ ]]
          docker manifest inspect "$EXPECTED_DB_IMAGE" >/dev/null
      - name: Execute isolated recovery test
        id: restore
        shell: bash
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BASH_ENV: ${{ github.workspace }}/target/ops/l1b-post-import-isolated-restore-telemetry.sh
        run: bash ops/l1b-post-import-isolated-restore-telemetry.sh --execute
      - name: Verify unconditional cleanup and publish sole recovery PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "$RUNNER_TEMP/l1b-b2-passphrase" "$RUNNER_TEMP/l1b-b1-run.json" \
            "$RUNNER_TEMP/l1b-b1-artifact.json" "$RUNNER_TEMP/l1b-b1-artifact.zip" \
            "$RUNNER_TEMP/l1b-b2-artifact"; do
            [[ ! -e "$path" && ! -L "$path" ]]
          done
          docker info >/dev/null 2>&1
          ! docker inspect "l1b-b2-restore-$GITHUB_RUN_ID" >/dev/null 2>&1
          ! docker ps -a --format '{{.Names}}' | grep -Fq '_l1b-b2-isolated'
          ! docker volume ls --format '{{.Name}}' | grep -Fq 'l1b-b2-isolated'
          ! find "$RUNNER_TEMP" -maxdepth 1 -name 'l1b-b2.*' -print -quit | grep -q .
          echo 'L1B_B2_UNCONDITIONAL_CLEANUP_COMPLETE'
          [[ "${{ steps.restore.outcome }}" == 'success' ]]
          echo 'L1B fresh post-import B-2 isolated restore: PASS'
