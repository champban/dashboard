name: Stage 5A round 4 source remediation

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-r4-remediate.yml

permissions:
  contents: write

concurrency:
  group: stage5a-r4-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate approved trigger and source head
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/feature/stage5a-line-import-conflict" ]]
          [[ "$(git log -1 --format=%s)" == "ops(stage5a): run round-4 remediation" ]]
          [[ "$(git rev-parse HEAD^)" == "0ff3eac0d38ee2a34ef71c5bd5e22f15081e163d" ]]
          git diff --quiet 297854c09205097a6a58cbce4c64961c802cd7a3 -- .github/workflows/verify.yml package.json package-lock.json

      - name: Apply deterministic four-finding remediation
        env:
          PATCH_GZIP_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, os
          from pathlib import Path
          payload = gzip.decompress(base64.b64decode(os.environ["PATCH_GZIP_B64"]))
          target = Path(os.environ["RUNNER_TEMP"]) / "stage5a-r4.py"
          target.write_bytes(payload)
          compile(payload, str(target), "exec")
          PYCODE
          python3 "$RUNNER_TEMP/stage5a-r4.py"

      - name: Validate source-only boundary before build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/actual.txt"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify generated package
        run: npm run verify

      - name: Scan secrets
        run: npm run scan-secrets

      - name: Validate final boundary and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final.txt"
          cat > "$RUNNER_TEMP/allowed-final.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed-final.txt" "$RUNNER_TEMP/final.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/final.txt"

      - name: Commit and push verified source-only remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "P Boy Stage5A Automation"
          git config user.email "champbanyat@gmail.com"
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && { echo "No remediation changes staged"; exit 1; }
          git commit -m "fix(stage5a): preserve concurrent local edits during recovery"
          git push origin HEAD:feature/stage5a-line-import-conflict
