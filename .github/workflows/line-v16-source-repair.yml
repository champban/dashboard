name: repair LINE v16 source escaping

on:
  push:
    branches:
      - fix/line-cancel-deploy-source-alignment

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair dynamic regex escaping') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/line-cancel-deploy-source-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repair dynamic RegExp template escaping
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'supabase/functions/line-todo-webhook/logic.js';
          let source = fs.readFileSync(path, 'utf8');

          const before = source;
          const targets = [
            'new RegExp(`^add(?:\\s+',
            'new RegExp(`^edit(?:\\s+',
            'new RegExp(`(?:^|\\s)${name}(?:\\s|$)`',
            'new RegExp(`(?:^|\\s)${word}(?:\\s|$)`',
            'new RegExp(`(?:^|\\s)${statusEntry[0]}(?:\\s|$)`',
          ];

          for (const target of targets) {
            source = source.split(target).join(target.replace('new RegExp(`', 'new RegExp(String.raw`'));
          }

          if (source === before) {
            throw new Error('No repair targets matched; refusing silent success');
          }

          fs.writeFileSync(path, source);
          NODE
      - name: Run focused LINE parser regressions before commit
        run: |
          node build/line-bot.test.mjs
          node build/line-cancel-flow.test.mjs
          node build/line-contract.test.mjs
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/line-todo-webhook/logic.js
          git commit -m "fix(line): repair dynamic regex escaping"
          git push origin HEAD:fix/line-cancel-deploy-source-alignment

# Retriggered after adding locked dependency installation for contract tests.
