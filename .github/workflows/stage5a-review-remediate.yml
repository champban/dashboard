name: Stage 5A review remediation

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-review-remediate.yml

permissions:
  contents: write

concurrency:
  group: stage5a-review-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.head_commit.message == 'ops(stage5a): enable review remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate trigger, branch and approved base
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/feature/stage5a-line-import-conflict' ]]
          [[ "$(git log -1 --format=%s)" == 'ops(stage5a): enable review remediation' ]]
          git merge-base --is-ancestor c58e76ad0833a1209ed69be142f3844769f9fed2 HEAD

      - name: Apply deterministic five-finding remediation
        env:
          PATCH_GZIP_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, os
          from pathlib import Path
          payload = gzip.decompress(base64.b64decode(os.environ['PATCH_GZIP_B64']))
          path = Path(os.environ['RUNNER_TEMP']) / 'stage5a-review-remediate.py'
          path.write_bytes(payload)
          compile(payload, str(path), 'exec')
          PYCODE
          python3 "$RUNNER_TEMP/stage5a-review-remediate.py"

      - name: Validate source-only boundary before build
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/actual.txt"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify build and generated package
        run: npm run verify

      - name: Scan secrets
        run: npm run scan-secrets

      - name: Validate final boundary and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final.txt"
          cat > "$RUNNER_TEMP/allowed-final.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed-final.txt" "$RUNNER_TEMP/final.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/final.txt"

      - name: Commit and push verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P Boy Stage5A Automation'
          git config user.email 'champbanyat@gmail.com'
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && { echo 'No remediation changes staged'; exit 1; }
          git commit -m 'fix(stage5a): resolve cloud-adopt review findings'
          git push origin HEAD:feature/stage5a-line-import-conflict
