name: L1B PR96 corrected concurrency remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/l1b-pr96-concurrency-orchestrator-v3.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify-or-apply:
    name: Correctly verify or apply exact PR96 remediation
    if: >-
      github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/l1b-pr96-concurrency-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: champban/dashboard
      OLD_HEAD: 2785e026891b37f2b192a58384b7c64eb412d376
      OLD_TREE: c8738810cd838d9041812957a4749db2edf5a084
      BASE: 297854c09205097a6a58cbce4c64961c802cd7a3
      EXPECTED_TREE: 3b193b10f55bddc8ceca75c233f2cf07c2df6ed5
      TARGET_BRANCH: ops/l1b-promotion-artifact-candidate
      TRANSFER_COMMENT_ID: '5432983389'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current target or apply exact durable transfer packet
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.run_attempt }}" == '1' ]]
          [[ "$GITHUB_REPOSITORY" == "$REPO" && "$GITHUB_BASE_REF" == main && "$GITHUB_HEAD_REF" == ops/l1b-pr96-concurrency-orchestrator ]]
          [[ "$(git rev-parse "$OLD_HEAD^{tree}")" == "$OLD_TREE" ]]

          remote="$(gh api "repos/$REPO/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)"
          remote_tree="$(gh api "repos/$REPO/git/commits/$remote" --jq .tree.sha)"
          if [[ "$remote" != "$OLD_HEAD" ]]; then
            [[ "$remote_tree" == "$EXPECTED_TREE" ]]
            [[ "$(gh api "repos/$REPO/git/commits/$remote" --jq '.parents | length')" == '1' ]]
            [[ "$(gh api "repos/$REPO/git/commits/$remote" --jq '.parents[0].sha')" == "$BASE" ]]
            echo "new_head=$remote" >> "$GITHUB_OUTPUT"
            echo "new_tree=$remote_tree" >> "$GITHUB_OUTPUT"
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/$REPO/issues/comments/$TRANSFER_COMMENT_ID" --jq .body > "$RUNNER_TEMP/transfer.md"
          python3 - "$RUNNER_TEMP/transfer.md" "$RUNNER_TEMP/pr96.patch" <<'PY'
          from pathlib import Path
          import re
          import sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          marker = '## Complete unified diff'
          if source.count(marker) != 1:
              raise SystemExit('transfer packet must contain exactly one complete-diff marker')
          blocks = re.findall(r'```diff\n(.*?)\n```', source.split(marker, 1)[1], flags=re.DOTALL)
          if len(blocks) != 1:
              raise SystemExit('transfer packet must contain exactly one complete diff block')
          patch = blocks[0]
          expected = (
              '.github/workflows/l1b-promotion-artifact-proof.yml',
              'PROJECT_CONTEXT.md',
              'docs/L1B_PROMOTION_ARTIFACT_CANDIDATE.md',
              'docs/L1B_PROMOTION_SECURITY_6D_REVIEW.md',
              'docs/evidence/L1B_PROMOTION_ARTIFACT_MANIFEST.json',
              'ops/l1b-promotion-artifact-proof.sh',
              'supabase/contracts/l1a_direct_todo.sql',
              'supabase/migrations/20260825011714_l1a_direct_todo.sql',
          )
          headers = tuple(re.findall(r'^diff --git a/(.*?) b/.*$', patch, flags=re.MULTILINE))
          if headers != expected:
              raise SystemExit(f'transfer packet scope/order differs: {headers!r}')
          Path(sys.argv[2]).write_text(patch + '\n', encoding='utf-8', newline='\n')
          PY

          git checkout --detach "$OLD_HEAD"
          git apply --check "$RUNNER_TEMP/pr96.patch"
          git apply "$RUNNER_TEMP/pr96.patch"
          cat > "$RUNNER_TEMP/expected-files" <<'EOF'
          .github/workflows/l1b-promotion-artifact-proof.yml
          PROJECT_CONTEXT.md
          docs/L1B_PROMOTION_ARTIFACT_CANDIDATE.md
          docs/L1B_PROMOTION_SECURITY_6D_REVIEW.md
          docs/evidence/L1B_PROMOTION_ARTIFACT_MANIFEST.json
          ops/l1b-promotion-artifact-proof.sh
          supabase/contracts/l1a_direct_todo.sql
          supabase/migrations/20260825011714_l1a_direct_todo.sql
          EOF
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --check

          npm ci
          npm test
          npm run verify
          npm run scan-secrets
          bash -n ops/l1b-promotion-artifact-proof.sh
          python3 -m json.tool docs/evidence/L1B_PROMOTION_ARTIFACT_MANIFEST.json >/dev/null
          cmp -s supabase/contracts/l1a_direct_todo.sql supabase/migrations/20260825011714_l1a_direct_todo.sql

          cat > "$RUNNER_TEMP/blobs" <<'EOF'
          833ccb2fd11567bba743ee5b5f3a1f58ac03930d  .github/workflows/l1b-promotion-artifact-proof.yml
          d3659bbdcb7f29f25825d86540d207af1cc78c48  PROJECT_CONTEXT.md
          d50a82189e7ad6530fe5f567e7f142a643cdd874  docs/L1B_PROMOTION_ARTIFACT_CANDIDATE.md
          286c4be12232567f547d38e06b3d9ff323805c00  docs/L1B_PROMOTION_SECURITY_6D_REVIEW.md
          43557f9e9adbeb5099b84531226f3fea435eb47a  docs/evidence/L1B_PROMOTION_ARTIFACT_MANIFEST.json
          ba7cbbaab6a6d785e8b22fa6a7b163ad08b0df91  ops/l1b-promotion-artifact-proof.sh
          03aa1f6dc34d6734dbef87b5a93d03896aacfec0  supabase/contracts/l1a_direct_todo.sql
          03aa1f6dc34d6734dbef87b5a93d03896aacfec0  supabase/migrations/20260825011714_l1a_direct_todo.sql
          EOF
          while read -r expected file; do [[ "$(git hash-object "$file")" == "$expected" ]]; done < "$RUNNER_TEMP/blobs"
          [[ "$(sha256sum supabase/migrations/20260825011714_l1a_direct_todo.sql | awk '{print $1}')" == d9a8764f801935b37eea3d8077fcfa83ce5b8646475e465c8cd4677e6d289cbf ]]
          [[ "$(stat -c %s supabase/migrations/20260825011714_l1a_direct_todo.sql)" == 35421 ]]

          git add -- $(cat "$RUNNER_TEMP/expected-files")
          tree="$(git write-tree)"
          [[ "$tree" == "$EXPECTED_TREE" ]]
          git config user.name champban
          git config user.email champbanyat@gmail.com
          new="$(printf '%s\n\n%s\n' 'fix(l1b): serialize dependency cycle validation' 'Add owner-scoped transaction advisory locking and deterministic PostgreSQL 17 concurrency evidence; refresh hashes and 6D documentation without Production effect.' | git commit-tree "$tree" -p "$BASE")"
          [[ "$(git rev-list --count "$BASE".."$new")" == 1 && "$(git merge-base "$BASE" "$new")" == "$BASE" ]]
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$OLD_HEAD" origin "$new:refs/heads/$TARGET_BRANCH"
          echo "new_head=$new" >> "$GITHUB_OUTPUT"
          echo "new_tree=$tree" >> "$GITHUB_OUTPUT"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Publish exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          head='${{ steps.apply.outputs.new_head }}'
          tree='${{ steps.apply.outputs.new_tree }}'
          applied='${{ steps.apply.outputs.applied }}'
          pr="$(gh api "repos/$REPO/pulls/96")"
          [[ "$(jq -r .head.sha <<<"$pr")" == "$head" ]]
          [[ "$(jq -r .base.sha <<<"$pr")" == "$BASE" ]]
          [[ "$(jq -r .draft <<<"$pr")" == true && "$(jq -r .merged <<<"$pr")" == false ]]
          marker="Exact dependency-concurrency remediation — head \`$head\`"
          comments="$(gh api --paginate "repos/$REPO/issues/96/comments?per_page=100" | jq -s add)"
          if ! jq -e --arg marker "$marker" '.[] | select((.body // "") | contains($marker))' <<<"$comments" >/dev/null; then
            gh api -X POST "repos/$REPO/issues/96/comments" -f body="## $marker

- tree \`$tree\`
- base \`main@$BASE\`
- one commit / eight changed files
- transfer packet, expected tree/blobs, migration-contract parity, npm verification and secret scan: **PASS**
- newly applied in this run: **$applied**
- dedicated PostgreSQL 17 proof and normal exact-head CI: **triggered / pending terminal verification**
- Production connection or effect: **NONE**

PR #96 remains Draft/unmerged and blocked from Production promotion until exact-head proof/CI and fresh independent review are green."
          fi
