name: Stage 5A round 4 verified transfer apply

on:
  push:
    branches:
      - feature/stage5a-line-import-conflict
    paths:
      - .github/workflows/stage5a-r4-transfer-apply.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: stage5a-r4-transfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Draft PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/stage5a-line-import-conflict
          fetch-depth: 0

      - name: Validate trigger and unchanged approved source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git log -1 --format=%s)" == "ops(stage5a): apply exact transferred local commit" ]]
          git merge-base --is-ancestor 921a7d780713dead2ab1c8b554dddaad0c59b4d2 HEAD
          git diff --quiet 921a7d780713dead2ab1c8b554dddaad0c59b4d2 -- \
            BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx \
            package.json package-lock.json .github/workflows/verify.yml

      - name: Wait for and verify exact Codex transfer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 90); do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/105/comments?per_page=100" \
              > "$RUNNER_TEMP/comments.json"
            set +e
            python3 - "$RUNNER_TEMP/comments.json" "$RUNNER_TEMP/stage5a-r4.patch" <<'PYCODE'
          import base64,gzip,hashlib,json,re,sys
          source,out=sys.argv[1:]
          pages=json.load(open(source,encoding='utf-8'))
          comments=[]
          for page in pages:
              comments.extend(page if isinstance(page,list) else [page])
          bodies=[str(item.get('body') or '') for item in comments]
          if any(body.startswith('STAGE5A_R4_TRANSFER_UNAVAILABLE') for body in bodies):
              raise SystemExit(3)
          complete=any(body.startswith('STAGE5A_R4_TRANSFER_COMPLETE') for body in bodies)
          pattern=re.compile(
              r'^STAGE5A_R4_TRANSFER (\d+)/(\d+) '
              r'patch_sha=([0-9a-f]{64}) gzip_sha=([0-9a-f]{64}) '
              r'b64_sha=([0-9a-f]{64}) patch_bytes=(\d+) gzip_bytes=(\d+) b64_bytes=(\d+)'
              r'[\s\S]*?```text\n([A-Za-z0-9+/=\n\r]+)\n```',re.M)
          groups={}
          for body in bodies:
              match=pattern.search(body)
              if not match: continue
              part,total=map(int,match.group(1,2))
              meta=match.group(3,4,5,6,7,8)
              payload=''.join(match.group(9).split())
              groups.setdefault((total,meta),{})[part]=payload
          candidates=[]
          for (total,meta),parts in groups.items():
              if len(parts)==total and set(parts)==set(range(1,total+1)):
                  candidates.append((total,meta,parts))
          if not complete or not candidates:
              raise SystemExit(2)
          total,meta,parts=candidates[-1]
          patch_sha,gzip_sha,b64_sha,patch_bytes,gzip_bytes,b64_bytes=meta
          b64=''.join(parts[i] for i in range(1,total+1))
          if len(b64)!=int(b64_bytes) or hashlib.sha256(b64.encode()).hexdigest()!=b64_sha:
              raise SystemExit('base64 transfer mismatch')
          packed=base64.b64decode(b64,validate=True)
          if len(packed)!=int(gzip_bytes) or hashlib.sha256(packed).hexdigest()!=gzip_sha:
              raise SystemExit('gzip transfer mismatch')
          patch=gzip.decompress(packed)
          if len(patch)!=int(patch_bytes) or hashlib.sha256(patch).hexdigest()!=patch_sha:
              raise SystemExit('decoded patch mismatch')
          open(out,'wb').write(patch)
          print(f'transfer verified: parts={total} patch_sha={patch_sha}')
          PYCODE
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then found=1; break; fi
            if [[ $rc -eq 3 ]]; then echo 'Codex exact local commit unavailable'; exit 43; fi
            if [[ $rc -ne 2 ]]; then echo "Transfer verification failed: $rc"; exit "$rc"; fi
            echo "Transfer not complete yet: attempt $attempt/90"
            sleep 10
          done
          [[ $found -eq 1 ]] || { echo 'Timed out waiting for exact transfer'; exit 44; }

      - name: Apply exact transferred patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/stage5a-r4.patch"
          git apply "$RUNNER_TEMP/stage5a-r4.patch"
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          ! grep -E '^(supabase/|auth\.js$|line-sync\.js$)' "$RUNNER_TEMP/actual.txt"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact transferred candidate
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run verify
          npm run scan-secrets
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/final.txt"
          cat > "$RUNNER_TEMP/allowed-final.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/allowed-final.txt" "$RUNNER_TEMP/final.txt"

      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'P Boy Stage5A Automation'
          git config user.email 'champbanyat@gmail.com'
          git add BUILD-MANIFEST.json CHANGELOG.md PROJECT_CONTEXT.md \
            build/line-contract.test.mjs build/sync-content-check.test.mjs \
            docs/STAGE5A_NO_MIGRATION_RELEASE.md index.html mobile/index.html src/App.jsx
          git diff --cached --quiet && { echo 'No transferred changes staged'; exit 1; }
          git commit -m 'fix(stage5a): preserve concurrent local edits during recovery'
          git push origin HEAD:feature/stage5a-line-import-conflict

      - name: Remove every temporary Stage 5A transfer file
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .stage5a-r4
          git rm -f --ignore-unmatch \
            .github/workflows/stage5a-r4-apply.yml \
            .github/workflows/stage5a-r4-diagnose.yml \
            .github/workflows/stage5a-r4-remediate.yml \
            .github/workflows/stage5a-r4-transfer-apply.yml
          git diff --cached --quiet || git commit -m 'chore(stage5a): remove temporary transfer tooling'
          git push origin HEAD:feature/stage5a-line-import-conflict
          git diff --name-only 297854c09205097a6a58cbce4c64961c802cd7a3..HEAD | LC_ALL=C sort > "$RUNNER_TEMP/release.txt"
          cat > "$RUNNER_TEMP/release-expected.txt" <<'EOF'
          BUILD-MANIFEST.json
          CHANGELOG.md
          PROJECT_CONTEXT.md
          build/line-contract.test.mjs
          build/sync-content-check.test.mjs
          docs/STAGE5A_NO_MIGRATION_RELEASE.md
          index.html
          mobile/index.html
          src/App.jsx
          EOF
          diff -u "$RUNNER_TEMP/release-expected.txt" "$RUNNER_TEMP/release.txt"
