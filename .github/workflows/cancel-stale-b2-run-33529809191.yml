name: Cancel superseded B-2 waiting run

on:
  push:
    branches:
      - ops/cancel-stale-b2-run-33529809191
    paths:
      - .github/workflows/cancel-stale-b2-run-33529809191.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-stale-b2-run-33529809191
  cancel-in-progress: false

jobs:
  cancel-stale-run:
    name: Cancel exact superseded B-2 run
    if: github.repository == 'champban/dashboard' && github.ref == 'refs/heads/ops/cancel-stale-b2-run-33529809191' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate identity and cancel exact stale run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly TARGET_RUN_ID='33529809191'
          readonly EXPECTED_STALE_HEAD='ddf96a3439f58c8bce796df0dbe5b23b8f6c474f'
          readonly EXPECTED_WORKFLOW='L1B fresh post-import B-2 isolated restore'
          readonly EXPECTED_NEW_RUN_ID='33534665670'
          readonly EXPECTED_NEW_HEAD='fe1e175ac1b95b1dbf2f2813171d65376cd4c402'
          readonly API_ROOT="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          readonly RUN_JSON="$RUNNER_TEMP/stale-run.json"
          readonly NEW_JSON="$RUNNER_TEMP/new-run.json"
          readonly RESPONSE="$RUNNER_TEMP/cancel-response.json"

          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )

          curl --fail --silent --show-error --location "${headers[@]}" \
            "$API_ROOT/$TARGET_RUN_ID" > "$RUN_JSON"

          readarray -t stale < <(python3 - "$RUN_JSON" "$TARGET_RUN_ID" "$EXPECTED_STALE_HEAD" "$EXPECTED_WORKFLOW" <<'PY'
          import json, sys
          path, run_id, expected_head, expected_name = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          if str(data.get('id')) != run_id:
              raise SystemExit('stale run id mismatch')
          if data.get('head_sha') != expected_head:
              raise SystemExit('stale run head mismatch')
          if data.get('name') != expected_name:
              raise SystemExit('stale workflow identity mismatch')
          print(data.get('status') or '')
          print(data.get('conclusion') or '')
          PY
          )

          if [[ "${stale[0]}" == 'completed' ]]; then
            [[ "${stale[1]}" == 'cancelled' ]]
          else
            code="$(curl --silent --show-error --location \
              --output "$RESPONSE" --write-out '%{http_code}' \
              --request POST "${headers[@]}" "$API_ROOT/$TARGET_RUN_ID/cancel")"
            [[ "$code" == '202' ]]
          fi

          cancelled=0
          for _ in $(seq 1 45); do
            curl --fail --silent --show-error --location "${headers[@]}" \
              "$API_ROOT/$TARGET_RUN_ID" > "$RUN_JSON"
            readarray -t state < <(python3 - "$RUN_JSON" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          print(data.get('status') or '')
          print(data.get('conclusion') or '')
          PY
            )
            if [[ "${state[0]}" == 'completed' && "${state[1]}" == 'cancelled' ]]; then
              cancelled=1
              break
            fi
            sleep 2
          done
          [[ "$cancelled" == '1' ]]

          curl --fail --silent --show-error --location "${headers[@]}" \
            "$API_ROOT/$EXPECTED_NEW_RUN_ID" > "$NEW_JSON"
          python3 - "$NEW_JSON" "$EXPECTED_NEW_RUN_ID" "$EXPECTED_NEW_HEAD" "$EXPECTED_WORKFLOW" <<'PY'
          import json, sys
          path, run_id, expected_head, expected_name = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          if str(data.get('id')) != run_id:
              raise SystemExit('replacement run id mismatch')
          if data.get('head_sha') != expected_head:
              raise SystemExit('replacement run head mismatch')
          if data.get('name') != expected_name:
              raise SystemExit('replacement workflow identity mismatch')
          if data.get('conclusion') in {'failure', 'cancelled', 'timed_out', 'action_required'}:
              raise SystemExit('replacement run is not viable')
          PY

          rm -f -- "$RUN_JSON" "$NEW_JSON" "$RESPONSE"
          echo 'STALE_B2_RUN_CANCELLED=PASS'
          echo 'REPLACEMENT_B2_SOURCE_RUN_RELEASED=PASS'
